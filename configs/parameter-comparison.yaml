description: Controlled temperature experiment on the same Azure deployment
prompts:
  - id: file://../prompts/summarization-v2.txt
    label: fixed-summary-prompt-v2
providers:
  - id: azure:chat:{{env.AZURE_OPENAI_DEPLOYMENT_NAME}}
    label: temperature-0
    config:
      apiHost: '{{env.AZURE_OPENAI_API_HOST}}'
      apiKeyEnvar: AZURE_OPENAI_API_KEY
      apiVersion: '{{env.AZURE_OPENAI_API_VERSION}}'
      temperature: 0
      max_tokens: 300
  - id: azure:chat:{{env.AZURE_OPENAI_DEPLOYMENT_NAME}}
    label: temperature-0.7
    config:
      apiHost: '{{env.AZURE_OPENAI_API_HOST}}'
      apiKeyEnvar: AZURE_OPENAI_API_KEY
      apiVersion: '{{env.AZURE_OPENAI_API_VERSION}}'
      temperature: 0.7
      max_tokens: 300
defaultTest:
  options:
    provider:
      id: azure:chat:{{env.AZURE_OPENAI_JUDGE_DEPLOYMENT_NAME}}
      config:
        apiHost: '{{env.AZURE_OPENAI_API_HOST}}'
        apiKeyEnvar: AZURE_OPENAI_API_KEY
        apiVersion: '{{env.AZURE_OPENAI_API_VERSION}}'
        temperature: 0
tests: file://../datasets/summarization.yaml
