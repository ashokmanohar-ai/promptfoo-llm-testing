name: Promptfoo red-team security scan

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

concurrency:
  group: promptfoo-redteam
  cancel-in-progress: false

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROMPTFOO_DISABLE_TELEMETRY: 'true'
      PROMPTFOO_DISABLE_SHARING: 'true'
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_HOST: ${{ secrets.AZURE_OPENAI_API_HOST }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_JUDGE_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_JUDGE_DEPLOYMENT_NAME || secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      MAXIMUM_SECURITY_FAILURES: '0'
      MAXIMUM_CRITICAL_VULNERABILITIES: '0'
      MAXIMUM_HIGH_VULNERABILITIES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate red-team configuration
        run: npm run validate
      - name: Generate current adversarial probes
        run: npm run redteam:generate
      - name: Evaluate generated probes and export results
        run: npm run redteam:eval
      - name: Enforce security gate
        run: node scripts/quality-gate.mjs reports/redteam-results.json security
      - name: Upload restricted security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-redteam-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

